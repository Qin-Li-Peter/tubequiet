<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TubeQuiet</title><link rel="stylesheet" href="popup.css"></head>
<body>
<main class="row">
  <div><h1>TubeQuiet</h1><p id="status" role="status">Loading…</p></div>
  <label class="toggle" title="Block ads. Changing this setting reloads open YouTube pages.">
    <input id="enabled" type="checkbox" role="switch" aria-label="Block ads" aria-describedby="status" disabled>
    <span class="track" aria-hidden="true"></span>
  </label>
</main>
<p id="error" role="alert" hidden></p>
<script src="popup.js" type="module"></script>
</body></html>
